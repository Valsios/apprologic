<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASECNA - Dashboard Article</title>
    <link th:href="@{/assets/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/icon-font/bootstrap-icons.css}">

    <!-- CSS locaux -->
    <link rel="stylesheet" th:href="@{/assets/css/dataTables.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/includeCss.css}">
    <link rel="stylesheet" th:href="@{/assets/css/form.css}">
</head>
<body>
<div th:replace="~{include/navbar :: navbar}"></div>

<!-- Wrapper: sidebar + content -->
<div class="wrapper">
    <div th:replace="~{include/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="container mt-4">
            <h3 class="text-black-50 mb-4"><i class="bi bi-bar-chart me-2"></i>Consommations :
                <strong th:text="${consommateur.description}"></strong>
            </h3>
            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title mb-3">Options d'analyse</h5>
                    <form th:action="@{/consommateur/consommations}" method="post" class="row g-3 align-items-end">
                        <input type="hidden" name="idConsommateur" th:value="${consommateur.idConsommateur}">
                        <div class="col-md-4">
                            <label for="month" class="form-label">Sélectionner le mois d'analyse</label>
                            <select class="form-select" id="month" name="month">
                                <option value=""> Tous</option>
                                <option th:each="month : ${months}"
                                        th:value="${months.indexOf(month)}"
                                        th:text="${month}"
                                        th:selected="${months.indexOf(month) == currentMonth}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="annee" class="form-label">Sélectionner l'année d'analyse</label>
                            <select class="form-select" id="annee" name="year">
                                <option th:each="year : ${availableYears}"
                                        th:value="${year}"
                                        th:text="${year}"
                                        th:selected="${year == currentYear}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-filter me-1"></i> Appliquer
                            </button>
                        </div>

                        <div class="col-md-6 text-end">
                    <span class="text-muted">
                        <i class="bi bi-info-circle me-1"></i>
                        Données pour l'année: <strong th:text="${currentYear} ?: 'Toutes'"></strong>
                        et mois : <strong th:text="${currentMonth != null ? months.get(currentMonth) : 'Tous'}"></strong>
                    </span>
                        </div>
                    </form>
                </div>
            </div>

            <div id="historyTable" class="card mt-4">
                <div class="card-header bg-light d-flex justify-content-between align-items-center">
                    <h5 class="card-title mb-0">Historique des consommations</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover" id="article-table">
                            <thead class="table-light">
                            <tr>
                                <th class="text-center" >Article</th>
                                <th class="text-center" >Total de consommations</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="mouvement : ${consommations}">
                                <td class="text-center" th:text="${mouvement.key}"></td>
                                <td class="text-center" th:text="${mouvement.value}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{include/footer :: footer}"></div>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {

        // Initialisation de DataTable
        const dataTable = $('#article-table').DataTable({
            pagingType: "simple_numbers",
            responsive: true,
            searching: false, // On désactive la recherche intégrée
            ordering: true,
            info: false,
            lengthMenu: [10, 20, 30, 50],
            language: {
                paginate: {
                    previous: 'Précédent',
                    next: 'Suivant'
                },
            },
            processing: true,
            serverSide: false
        });
    });
</script>

</body>
</html>
