<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ASECNA - Approvisionnement et Achat</title>
    <link th:href="@{/assets/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/icon-font/bootstrap-icons.css}">

    <!-- CSS locaux -->
    <link rel="stylesheet" th:href="@{/assets/css/dataTables.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/includeCss.css}">
    <link rel="stylesheet" th:href="@{/assets/css/form.css}">

    <style>
        .autocomplete-dropdown {
            display: none;
            position: absolute;
            z-index: 1000;
            width: 100%;
            max-height: 300px;
            overflow-y: auto;
            background: white;
            border: 1px solid #ddd;
            border-radius: 0.25rem;
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.15);
        }

        .autocomplete-item {
            padding: 0.5rem;
            cursor: pointer;
        }

        .autocomplete-item:hover {
            background-color: #f8f9fa;
        }

        .progress-bar {
            transition: width 0.3s ease;
        }
    </style>

</head>
<body>
<div th:replace="~{include/navbar :: navbar}"></div>

<!-- Wrapper: sidebar + content -->
<div class="wrapper">

    <div th:replace="~{include/sidebar :: sidebar}"></div>

    <!-- Modal pour uploader un fichier -->
    <div class="modal fade" id="assignModal" tabindex="-1" aria-labelledby="assignModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="assignModalLabel">Assigner à un nouvel Article</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="assignForm">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input id="gisementId" name="gisementId" type="hidden">
                        <div class="mb-3">
                            <label for="articleAssign" class="form-label">Choisir l'article</label>
                            <input class="form-control" type="text" id="articleAssign" name="articleAssign" autocomplete="off" required>
                            <input id="articleAssignId" name="articleAssignId" type="hidden">
                            <div id="articleDropdownAssign" class="autocomplete-dropdown"></div>
                        </div>
                        <div class="mb-3">
                            <label for="capacite" class="form-label">Capacité max</label>
                            <input class="form-control" type="text" id="capacite" name="capacite" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn btn-primary" id="submitAssign">Envoyer</button>
                </div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="table-responsive shadow rounded bg-light p-3">
            <h3 class="text-black-50 mb-3">Occupation des locaux</h3>
            <!-- Filtres interactifs -->
            <div class="card mb-4">
                <div class="card-body">
                    <div class="row g-3" id="filters">
                        <!-- Filtre Local -->
                        <div class="col-md-3">
                            <label for="localFilter" class="form-label">Local</label>
                            <select id="localFilter" class="form-select">
                                <option value="">Tous les locaux</option>
                                <option th:each="local : ${allLocals}"
                                        th:value="${local.idLocal}"
                                        th:text="${local.designation}">
                                </option>
                            </select>
                        </div>

                        <!-- Filtre État -->
                        <div class="col-md-2">
                            <label for="statusFilter" class="form-label">État</label>
                            <select id="statusFilter" class="form-select">
                                <option value="all">Tous</option>
                                <option value="free">Libre</option>
                                <option value="occupied">Occupé</option>
                            </select>
                        </div>

                        <!-- Filtre Article -->
                        <div class="col-md-4 position-relative">
                            <label for="articleFilter" class="form-label">Article</label>
                            <input type="text" id="articleFilter" class="form-control" placeholder="Code ou désignation" autocomplete="off">
                            <input type="hidden" id="articleId">
                            <div id="articleDropdown" class="autocomplete-dropdown"></div>
                        </div>

                        <!-- Reset -->
                        <div class="col-md-3 d-flex align-items-end">
                            <button onclick="resetFilters()" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-counterclockwise"></i> Réinitialiser
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <table id="article-table" class="table table-striped table-hover table-bordered">
                <thead class="table-light">
                <tr>

                    <th>Local</th>
                    <th>Travé</th>
                    <th>Alvéole</th>
                    <th>Etagère</th>
                    <th>Bac</th>
                    <th>Article</th>
                    <th>Capacité Max</th>
                    <th>Occupations libre</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="occupation : ${local_liste}">
                    <td class="text-start"><span th:text="${occupation.gisement.local.designation}"></span></td>

                    <td class="text-end" th:text="${#numbers.formatInteger(occupation.gisement.trave,2)}">Travé</td>
                    <td class="text-start" th:text="${occupation.gisement.alveole}">Alvéole</td>
                    <td class="text-end" th:text="${#numbers.formatInteger(occupation.gisement.etagere,2)}">Etagère</td>
                    <td class="text-end" th:text="${#numbers.formatInteger(occupation.gisement.bac,2)}">Bac</td>
                    <td class="text-start">
                        <strong th:text="${occupation.article.codeArticle}"></strong>-
                        <span th:text="${occupation.article.designation}"></span>
                    </td>
                    <td class="text-end" th:text="${occupation.capaciteMaxUnnitaire}"></td>
                    <td>
                        <div class="d-flex align-items-center">
                            <div class="progress me-2" style="height: 10px; width: 80px;">
                                <div cclass="progress-bar"
                                     th:classappend="${occupation.tauxLibre() <= 30} ? 'bg-danger' :
                                    (${occupation.tauxLibre() <= 60} ? 'bg-warning' : 'bg-success')"
                                     th:style="'width:' + ${occupation.tauxLibre()} + '%'"
                                     role="progressbar"></div>
                            </div>
                            <span th:text="${#numbers.formatDecimal(occupation.tauxLibre(),1,2)} + '%'"></span>
                        </div>
                    </td>
                    <td>
                        <!-- Nouvelle colonne avec bouton conditionnel -->
                        <button th:if="${occupation.absolu() < 0.01}"
                                class="btn btn-action assign"
                                title="Assigner à un nouvel article"
                                data-bs-toggle="modal"
                                data-bs-target="#assignModal"
                                th:data-gisement-id="${occupation.gisement.idGisement}">
                            <i class="bi bi-plus-circle"></i>
                        </button>
                    </td>
                </tr>
                <tr th:if="${local_liste.isEmpty()}">
                    <td colspan="3" class="text-center text-muted">Aucun local trouvé</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{include/footer :: footer}"></div>
<script src="/assets/js/myScript/scriptLocal.js"></script>
<script src="/assets/js/myScript/scriptAssign.js"></script>
</body>
</html>
