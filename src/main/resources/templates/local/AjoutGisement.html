<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASECNA - Approvisionnement et Achat</title>
    <link th:href="@{/assets/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/icon-font/bootstrap-icons.css}">

    <!-- CSS locaux -->
    <link rel="stylesheet" th:href="@{/assets/css/dataTables.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/includeCss.css}">
    <link rel="stylesheet" th:href="@{/assets/css/form.css}">

</head>
<body>
<div th:replace="~{include/navbar :: navbar}"></div>

<!-- Wrapper: sidebar + content -->
<div class="wrapper">

    <div th:replace="~{include/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="tab-content" id="formTabsContent">
            <!-- Formulaire Simple -->
            <div class="tab-pane fade show active" id="simpleFormTab" role="tabpanel">
                <div class="form-section">
                    <h2 class="form-title">
                        <i class="bi bi-box-seam me-2"></i>Nouveau Gisement
                    </h2>

                    <form th:action="@{/local/save}"
                          th:object="${gisement}"
                          method="post">

                        <div class="mb-3">
                            <label for="local" class="form-label">Local<span class="text-danger">*</span></label>
                            <select class="form-select" id="local" th:field="*{local.idLocal}" required>
                                <option value="">Sélectionner un Local</option>
                                <option th:each="local : ${local_list}"
                                        th:value="${local.idLocal}"
                                        th:text="${local.designation}"
                                ></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="trave" class="form-label">Trave<span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="trave"
                                   th:field="*{trave}"
                                   placeholder="Travé (1,2,...)"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="alveole" class="form-label">Alvéole<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="alveole"
                                   th:field="*{alveole}"
                                   placeholder="Alvéole (A,B,...)"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="etagere" class="form-label">Etagère<span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="etagere"
                                   th:field="*{etagere}"
                                   placeholder="Etgaère (1,2,...)"
                                   required>
                        </div>
                        <div class="mb-3">
                            <label for="bac" class="form-label">Bac<span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="bac"
                                   th:field="*{bac}"
                                   placeholder="Bac (1,2,...)"
                                   required>
                        </div>

                        <div class="d-flex justify-content-end mt-4">
                            <button type="submit" class="btn btn-primary">Soumettre</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{include/footer :: footer}"></div>

</body>
</html>
