<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APPROLOGIC</title>
    <link href="/assets/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="/assets/css/login.css" rel="stylesheet">
</head>
<body>
<div class="container d-flex justify-content-center">
    <div class="login-card">
        <div class="logo-container">
            <img src="/assets/logo/asecna-logo-2.png" alt="ASECNA Logo" class="asecna-logo">
        </div>

        <div class="form-container">
            <!-- Message d'erreur -->
            <div class="alert alert-danger d-flex align-items-center gap-2"
                 th:if="${param.error != null}"
                 role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <div>Identifiants incorrects</div>
            </div>

            <h2 class="form-title">APPROLOGIC</h2>

            <!-- Formulaire modifié -->
            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label for="username" class="form-label">Nom d'utilisateur</label>
                    <input type="text" name="username" class="form-control" id="username"
                           placeholder="Entrez votre nom d'utilisateur">
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Mot de passe</label>
                    <input type="password" name="password" class="form-control" id="password"
                           placeholder="Entrez votre mot de passe">
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary btn-login">Se connecter</button>
                </div>
            </form>

            <p class="footer-text">© 2025 APPROLOGIC. Tous droits réservés.</p>
        </div>
    </div>
</div>

<script src="/assets/js/bootstrap.bundle.min.js"></script>
</body>
</html>
