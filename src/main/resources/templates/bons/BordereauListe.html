<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASECNA - Approvisionnement et Achat</title>
    <link th:href="@{/assets/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/icon-font/bootstrap-icons.css}">

    <!-- CSS locaux -->
    <link rel="stylesheet" th:href="@{/assets/css/dataTables.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/includeCss.css}">
    <link rel="stylesheet" th:href="@{/assets/css/form.css}">


</head>
<body>
<div th:replace="~{include/navbar :: navbar}"></div>

<!-- Wrapper: sidebar + content -->
<div class="wrapper">

    <div th:replace="~{include/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="table-responsive shadow rounded bg-light p-3">
            <h3 class="text-black-50 mb-3">Liste des bordereaux</h3>


            <div th:if="${warning}" class="alert alert-warning alert-dismissible fade show" role="alert">
                <span th:text="${warning}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>


            <div class="card mb-4">
                <div class="card-body">
                    <form method="post" th:action="@{/bordereau/filtrer}">
                        <div class="row g-3" id="filters">

                            <!-- Filtre Local -->
                            <div class="col-md-3">
                                <label for="consommateur" class="form-label">Service</label>
                                <select class="form-select" id="consommateur" name="idConsommateur">
                                    <option value="" selected disabled>Sélectionnez un service</option>
                                    <option th:each="consommateur : ${consommateur_liste}"
                                            th:value="${consommateur.idConsommateur}"
                                            th:text="${consommateur.description}"
                                            th:selected="${consommateurId != null && consommateurId == consommateur.idConsommateur}">
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-3" id="enfant-container" style="display:none;">
                                <label for="consommateur-enfant" class="form-label">Unité</label>
                                <select class="form-select" id="consommateur-enfant" name="idConsommateurFille">
                                    <option value="" selected>Sélectionnez une unité (optionnel)</option>
                                    <!-- Les options seront ajoutées dynamiquement -->
                                </select>
                            </div>

                            <!-- Date Début -->
                            <div class="col-md-2">
                                <label for="dateDebut" class="form-label">Date Début</label>
                                <input type="datetime-local" class="form-control" id="dateDebut" th:value="${#temporals.format(debut,'yyyy-MM-dd''T''HH:mm')}" name="debut" >
                            </div>

                            <!-- Date Fin -->
                            <div class="col-md-2">
                                <label for="dateFin" class="form-label">Date Fin</label>
                                <input type="datetime-local" class="form-control" id="dateFin" th:value="${#temporals.format(fin,'yyyy-MM-dd''T''HH:mm')}" name="fin" >
                            </div>

                            <!-- Boutons -->
                            <div class="col-md-2 d-flex align-items-end">
                                <button type="submit" class="btn btn-primary me-2">
                                    <i class="bi bi-search"></i>
                                </button>
                                <a th:href="@{/bordereau/liste}" class="btn btn-outline-secondary">
                                    <i class="bi bi-arrow-counterclockwise"></i>
                                </a>
                            </div>

                        </div>
                    </form>
                </div>
            </div>
            <table id="article-table" class="table table-striped table-hover table-bordered">
                <thead class="table-light">
                <tr>
                    <th>Id</th>
                    <th>Date demande</th>
                    <th>Consommateur</th>
                    <th>Adresse</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="bordereau : ${bordereau_liste}">
                    <td >BD<span th:text="${bordereau.idBordereauMere}"></span></td>
                    <td th:text="${#temporals.format(bordereau.demandeMere.dateDemande,'dd/MM/yyyy HH:mm')}">Date commande</td>
                    <td th:text="${bordereau.demandeMere.consommateur.description}">Département</td>
                    <td th:text="${bordereau.demandeMere.adresse.adresse}">Adresse</td>
                    <td>
                        <div class="btn-group" role="group">
                            <form th:action="@{/documents/generer-bordereau}" method="post" style="display: inline;">
                                <input type="hidden" name="idBordereau" th:value="${bordereau.idBordereauMere}">
                                <button type="submit" class="btn btn-action edit" title="Créer pdf">
                                    <i class="bi bi-download"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${bordereau_liste.isEmpty()}">
                    <td colspan="3" class="text-center text-muted">Aucun bordereau trouvé</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>


</div>

<div th:replace="~{include/footer :: footer}"></div>
<script th:inline="javascript">
    // Vérifier si le téléchargement doit être déclenché
    const csvContent = [[${csvContent}]];
    const fileName = [[${csvFileName}]];
    const showDownload = [[${showDownload}]];

    if (showDownload && csvContent && fileName) {
        // Créer un formulaire temporaire pour soumettre les données
        const form = document.createElement('form');
        form.method = 'GET';
        form.action = '/documents/downloadRepartitionLivraison';

        // Ajouter les paramètres
        const contentInput = document.createElement('input');
        contentInput.type = 'hidden';
        contentInput.name = 'content';
        contentInput.value = csvContent;
        form.appendChild(contentInput);

        const fileNameInput = document.createElement('input');
        fileNameInput.type = 'hidden';
        fileNameInput.name = 'fileName';
        fileNameInput.value = fileName;
        form.appendChild(fileNameInput);

        // Ajouter le formulaire à la page et le soumettre
        document.body.appendChild(form);
        form.submit();
        document.body.removeChild(form);

        setTimeout(() => {
            window.location.reload();
        }, 4000);
    }
</script>
<script src="/assets/js/myScript/scriptServiceUnite.js"></script>
</body>
</html>
