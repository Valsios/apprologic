<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASECNA - Approvisionnement et Achat</title>
    <link th:href="@{/assets/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/icon-font/bootstrap-icons.css}">

    <!-- CSS locaux -->
    <link rel="stylesheet" th:href="@{/assets/css/dataTables.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/includeCss.css}">
    <link rel="stylesheet" th:href="@{/assets/css/form.css}">
</head>
<body>
<div th:replace="~{include/navbar :: navbar}"></div>

<div class="wrapper">
    <div th:replace="~{include/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="form-section">
            <h2 class="form-title">Création de Bordereau</h2>

            <!-- Messages d'alerte -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Informations sur la commande -->
            <div class="card mb-4">
                <div class="card-header">
                    <h5>Informations sur la commande</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4">
                            <p><strong>N° Commande:</strong> <span th:text="${bordereau.demandeMere.idDemandeMere}"></span></p>
                            <p><strong>Date Demande:</strong> <span th:text="${#temporals.format(bordereau.demandeMere.dateDemande, 'dd/MM/yyyy')}"></span></p>
                        </div>
                        <div class="col-md-4">
                            <p><strong>Consommateur:</strong> <span th:text="${bordereau.demandeMere.consommateur.description}"></span></p>
                            <p><strong>Adresse:</strong> <span th:text="${bordereau.demandeMere.adresse.adresse}"></span></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Formulaire de bordereau -->
            <form th:action="@{/bordereau/save}" th:object="${bordereau}" method="post">
                <input type="hidden" th:field="*{demandeMere}">

                <div class="row mb-4">
                    <div class="col-md-4">
                        <div class="mb-3">
                            <label for="dateBordereau" class="form-label">Date Bordereau</label>
                            <input type="datetime-local" id="dateBordereau" name="dateBordereau" class="form-control"
                                   th:value="${bordereau.dateBordereau != null ? #temporals.format(bordereau.dateBordereau, 'yyyy-MM-dd''T''HH:mm') : #temporals.format(#temporals.createNow(), 'yyyy-MM-dd''T''HH:mm')}"
                                   required>

                        </div>

                        <div class="mb-3">
                            <label for="devise" class="form-label">Devise</label>
                            <select class="form-select" th:field="*{devise}" id="devise" required>
                                <option value="">Sélectionnez une devise</option>
                                <option th:each="devise : ${devise_liste}"
                                        th:value="${devise.idDevise}"
                                        th:text="${devise.acronyme}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="mb-3">
                            <label for="transport" class="form-label">Transport</label>
                            <select class="form-select" th:field="*{transport}" id="transport" required>
                                <option value="">Sélectionnez un transport</option>
                                <option th:each="transport : ${transport_liste}"
                                        th:value="${transport.idTransport}"
                                        th:text="${transport.type}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="colisage" class="form-label">Colisage</label>
                            <input type="number" class="form-control" th:field="*{colisage}" id="colisage" min="0">
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="mb-3">
                            <label for="poids" class="form-label">Poids (kg)</label>
                            <input type="number" step="0.01" class="form-control" th:field="*{poids}" id="poids" min="0">
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" th:field="*{description}" id="description" rows="3" required></textarea>
                </div>

                <!-- Liste des articles -->
                <h5 class="mb-3">Articles à livrer</h5>
                <div class="table-responsive shadow rounded bg-light mb-4">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Article</th>
                            <th>Quantité demandé</th>
                            <th>Quantité à livrer</th>
                            <th>Prix Unitaire (MGA) </th>
                            <th>Unité</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="ligne, stat : ${commandeFille_liste}">
                            <td>
                                <input type="hidden" th:name="|lignes${ligne.idDemandeFille}.idArticle|" th:value="${ligne.article.idArticle}">
                                <span th:text="${ligne.article.codeArticle}"></span> -
                                <span th:text="${ligne.article.designation}"></span>
                            </td>
                            <td th:text="${ligne.quantite}"></td>
                            <td>
                                <input type="number" th:name="|lignes${ligne.idDemandeFille}.quantiteLivree|"
                                       class="form-control" min="0" th:max="${ligne.quantite}"
                                       th:value="${ligne.quantite}" step="0.01">
                            </td>
                            <td>
                                <input type="number" th:name="|lignes${ligne.idDemandeFille}.prixUnitaire|"
                                       th:value="${#numbers.formatDecimal(ligne.article.prixPondere, 1, 2, 'POINT')}"
                                       class="form-control" min="0" step="0.01">
                            </td>
                            <td th:text="${ligne.article.udm.description}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a th:href="@{/bordereau/liste}" class="btn btn-outline-secondary">
                        <i class="bi bi-list me-1"></i> Liste
                    </a>
                    <button type="submit" class="btn btn-primary">Enregistrer le Bordereau</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{include/footer :: footer}"></div>

</body>
</html>
