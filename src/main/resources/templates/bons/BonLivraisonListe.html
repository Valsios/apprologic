<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ASECNA - Approvisionnement et Achat</title>
    <link th:href="@{/assets/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/icon-font/bootstrap-icons.css}">

    <!-- CSS locaux -->
    <link rel="stylesheet" th:href="@{/assets/css/dataTables.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/includeCss.css}">
    <link rel="stylesheet" th:href="@{/assets/css/form.css}">


</head>
<body>
<div th:replace="~{include/navbar :: navbar}"></div>

<!-- Wrapper: sidebar + content -->
<div class="wrapper">

    <div th:replace="~{include/sidebar :: sidebar}"></div>

    <!-- Modal pour uploader un fichier -->
    <div class="modal fade" id="uploadModal" tabindex="-1" aria-labelledby="uploadModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="uploadModalLabel">Ajouter une pièce jointe</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="uploadForm" enctype="multipart/form-data">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <div class="mb-3">
                            <label for="fileInput" class="form-label">Sélectionnez un fichier</label>
                            <input class="form-control" type="file" id="fileInput" name="file" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn btn-primary" id="submitUpload">Envoyer</button>
                </div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="table-responsive shadow rounded bg-light p-3">
            <h3 class="text-black-50 mb-3">Liste des livraisons</h3>
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>


            <table id="article-table" class="table table-striped table-hover table-bordered">
                <thead class="table-light">
                <tr>
                    <th>Id</th>
                    <th>Fournisseur</th>
                    <th>Déscription</th>
                    <th>Devise</th>
                    <th>Date Livraison</th>
                    <th>Pièce Jointe</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="livraison : ${livraison_liste}">
                    <td>BC<span th:text="${livraison.idBlMere}"></span></td>

                    <td th:text="${livraison.fournisseur.nom}">Fournisseur</td>
                    <td th:text="${livraison.description}">CODE123</td>
                    <td th:text="${livraison.devise.designation}">Devise</td>
                    <td th:text="${#temporals.format(livraison.dateReception,'dd/MM/yyyy HH:mm')}">Date livraison</td>
                    <td>
                        <th:block th:if="${livraison.pieceJointe == null}" >
                            <button class="btn btn-action " title="Ajouter pièce jointe"
                                    data-action="upload"
                                    th:attr="data-livraison-id=${livraison.idBlMere}"
                            >
                                <i class="bi bi-plus-circle"></i>
                            </button>
                        </th:block>
                        <th:block th:unless="${livraison.pieceJointe == null}">
                            <button class="btn btn-action"
                                    title="Afficher pièce jointe"
                                    data-action="view-attachment"
                                    th:attr="data-livraison-id=${livraison.idBlMere}">
                                <i class="bi bi-paperclip"></i>
                            </button>
                        </th:block>
                    </td>
                </tr>
                <tr th:if="${livraison_liste.isEmpty()}">
                    <td colspan="3" class="text-center text-muted">Aucune livraison trouvée</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{include/footer :: footer}"></div>
<script src="/assets/js/myScript/scriptFileLivraison.js"></script>
<script>
    // Initialisation DataTable
    $(document).ready(function() {
        $('#article-table').DataTable({
            pagingType: "simple_numbers",
            responsive: true,
            searching: false,
            ordering: true,
            info: false,
            lengthMenu: [5, 10, 25, 50],
            language: {
                paginate: {
                    previous: 'Précédent',
                    next: 'Suivant'
                }
            }
        });
    });
</script>
</body>
</html>
