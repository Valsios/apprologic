<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASECNA - Approvisionnement et Achat</title>
    <link th:href="@{/assets/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/icon-font/bootstrap-icons.css}">

    <!-- CSS locaux -->
    <link rel="stylesheet" th:href="@{/assets/css/dataTables.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/includeCss.css}">
    <link rel="stylesheet" th:href="@{/assets/css/form.css}">


</head>
<body>
<div th:replace="~{include/navbar :: navbar}"></div>

<!-- Wrapper: sidebar + content -->
<div class="wrapper">

    <div th:replace="~{include/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="table-responsive shadow rounded bg-light p-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="text-black-50 mb-3">Liste des devises</h3>
            </div>



            <table id="article-table" class="table table-striped table-hover table-bordered">
                <thead class="table-light">
                <tr>
                    <th>Id</th>
                    <th>Désignation</th>
                    <th>Acronyme</th>
                    <th>Cours</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="devise : ${devise_liste}">
                    <td>DEV<span th:text="${devise.idDevise}"></span></td>
                    <td><span th:text="${devise.designation}"></span></td>
                    <td><span th:text="${devise.acronyme}"></span></td>
                    <td>
                        <div class="btn-group" role="group" th:if="${devise.acronyme!='MGA'}">
                            <form th:action="@{/devise/updateCours}" method="post" class="d-flex align-items-center">
                                <input type="hidden" name="idDevise" th:value="${devise.idDevise}">
                                <input type="text" class="form-control me-2" name="nouveauCours"
                                       style="width: 120px;" th:value="${devise.coursAriary}">
                                <button type="submit" class="btn btn-primary btn-sm">
                                    <i class="bi bi-pencil"></i>
                                </button>
                            </form>
                        </div>
                        <span th:if="${devise.acronyme=='MGA'}">x1</span>
                    </td>
                </tr>
                <tr th:if="${devise_liste.isEmpty()}">
                    <td colspan="3" class="text-center text-muted">Aucun devise trouvé</td>
                </tr>
                </tbody>
            </table>
        </div>
        <hr>
        <div class="tab-pane fade show active" id="simpleFormTab" role="tabpanel">
            <div class="form-section">
                <h2 class="form-title">
                    <i class="bi bi-currency-euro me-2"></i>Nouveau Devise
                </h2>

                <form th:action="@{/devise/save}"
                      th:object="${devise}"
                      method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <div class="mb-3">
                        <label for="designation" class="form-label">Désignation <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="designation"
                               th:field="*{designation}"
                               placeholder="Entrez le nom"
                               required>
                        <div class="invalid-feedback">
                            Veuillez saisir le nom du devise
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="acronyme" class="form-label">Acronyme <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="acronyme"
                               th:field="*{acronyme}"
                               placeholder="Acronyme (MGA , EUR, ...)"
                               required>
                        <div class="invalid-feedback">
                            Veuillez saisir l'acronyme
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="cours" class="form-label">Cours Ariary <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="cours"
                               th:field="*{coursAriary}"
                               placeholder="5200"
                               required>
                        <div class="invalid-feedback">
                            Veuillez saisir le cours
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save me-1"></i> Enregistrer
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{include/footer :: footer}"></div>
</body>
</html>
