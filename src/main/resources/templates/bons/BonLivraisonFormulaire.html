<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASECNA - Approvisionnement et Achat</title>
    <link th:href="@{/assets/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/icon-font/bootstrap-icons.css}">

    <!-- CSS locaux -->
    <link rel="stylesheet" th:href="@{/assets/css/dataTables.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/includeCss.css}">
    <link rel="stylesheet" th:href="@{/assets/css/form.css}">
    <link rel="stylesheet" th:href="@{/assets/css/dropdown.css}">

</head>
<body>
<div th:replace="~{include/navbar :: navbar}"></div>

<!-- Wrapper: sidebar + content -->
<div class="wrapper">

    <div th:replace="~{include/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="tab-content" id="formTabsContent">


            <!-- Bon de Commande -->
            <div class="tab-pane fade show active" id="bonCommandeTab" role="tabpanel">
                <div class="form-section">
                    <h2 class="form-title">Bon Livraison</h2>

                    <form id="bonCommandeForm" method="post" th:action="@{/bonLivraison/save}" th:object="${bonLivraison}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <div class="row mb-4">

                            <!-- Colonne Fournisseur -->
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="fournisseur" class="form-label">Fournisseur</label>
                                    <select class="form-select" th:field="*{fournisseur}" id="fournisseur" name="fournisseur" required>
                                        <option value="" selected disabled>Sélectionnez un Fournisseur</option>
                                        <option th:each="fournisseur : ${fournisseur_liste}"
                                                th:value="${fournisseur.idFournisseur}"
                                                th:text="${fournisseur.nom}">
                                        </option>
                                    </select>
                                </div>
                            </div>

                            <!-- Colonne Devise -->
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="devise" class="form-label">Devise</label>
                                    <select class="form-select" th:field="*{devise}" id="devise" name="devise" required>
                                        <option value="" selected disabled>Sélectionnez un Devise</option>
                                        <option th:each="devise : ${devise_liste}"
                                                th:value="${devise.idDevise}"
                                                th:text="${devise.acronyme}">
                                        </option>
                                    </select>
                                </div>
                            </div>

                            <!-- Colonne Date -->
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="dateReception" class="form-label">Date de livraison</label>
                                    <input type="datetime-local" id="dateReception" name="dateReception" class="form-control"
                                           th:value="${bonLivraison.dateReception != null ? #temporals.format(bonLivraison.dateReception, 'yyyy-MM-dd''T''HH:mm') : #temporals.format(#temporals.createNow(), 'yyyy-MM-dd''T''HH:mm')}"
                                           required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" th:field="*{description}" id="description" name="description" rows="3" required></textarea>
                            </div>
                            <h5 class="mb-3">Articles Livrés</h5>
                            <div class="table-responsive shadow rounded bg-light mb-4">
                                <table id="lignesCommande" class="table">
                                    <thead class="table-light">
                                    <tr>
                                        <th>Article</th>
                                        <th>Quantité demandée</th>
                                        <th>Quantitée reçue</th>
                                        <th>PU</th>
                                    </tr>
                                    </thead>
                                    <tbody id="articles-body">
                                    <tr class="template-row" style="display:none;">
                                        <td>
                                            <input name="lignesX.idArticle" type="hidden">
                                            <input type="text" class="form-control article-ref" autocomplete="off">
                                        </td>
                                        <td>
                                            <input name="lignesX.quantiteDemande" type="number" class="form-control article-qty" min="1" value="1">
                                        </td>

                                        <td>
                                            <input name="lignesX.quantiteReçu" type="number" class="form-control article-qty" min="1" value="1">
                                        </td>

                                        <td>
                                            <input name="lignesX.PU" type="number" class="form-control article-qty" min="1" value="1">
                                        </td>

                                        <td>
                                            <button type="button" class="btn btn-sm btn-danger remove-row">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                    <!-- Les lignes existantes seront ajoutées ici -->
                                    </tbody>
                                </table>
                            </div>

                            <div class="d-flex justify-content-between mb-4">
                                <button type="button" class="btn btn-secondary" id="add-article">
                                    <i class="bi bi-plus-circle"></i> Ajouter un article
                                </button>
                            </div>

                            <div class="d-flex justify-content-between mt-4">
                                <a th:href="@{/bonLivraison/liste}" class="btn btn-outline-secondary">
                                    <i class="bi bi-list me-1"></i> Liste
                                </a>
                                <div>
                                    <button type="submit" class="btn btn-primary">Valider la livraison</button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{include/footer :: footer}"></div>
<script src="/assets/js/myScript/scriptLivraison.js"></script>
</body>
</html>
