<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASECNA - Erreur <span th:text="${errorCode}">404</span></title>
    <link th:href="@{/assets/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/icon-font/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/assets/css/dataTables.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/includeCss.css}">

    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --success-color: #2ecc71;
            --warning-color: #f39c12;
            --light-bg: #f8f9fa;
        }

        .error-content {
            min-height: calc(100vh - 150px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .error-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 3rem;
            text-align: center;
            max-width: 600px;
            width: 100%;
            border-top: 4px solid var(--accent-color);
        }

        .error-icon {
            font-size: 5rem;
            color: var(--accent-color);
            margin-bottom: 1.5rem;
        }

        .error-code {
            font-size: 4rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .error-title {
            font-size: 1.8rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .error-message {
            color: #7f8c8d;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .error-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-asecna {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-asecna:hover {
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
            transform: translateY(-2px);
        }

        .btn-outline-asecna {
            border-color: var(--primary-color);
            color: var(--primary-color);
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-outline-asecna:hover {
            background-color: var(--primary-color);
            color: white;
            transform: translateY(-2px);
        }

        .error-details {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #eee;
            font-size: 0.9rem;
            color: #95a5a6;
        }

        @media (max-width: 992px) {
            .error-container {
                margin-left: 0;
            }
        }

        @media (max-width: 768px) {
            .error-content {
                padding: 20px 15px;
            }

            .error-container {
                padding: 2rem 1.5rem;
            }

            .error-code {
                font-size: 3rem;
            }

            .error-title {
                font-size: 1.5rem;
            }

            .error-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<!-- Navbar -->
<div th:replace="~{include/navbar :: navbar}"></div>

<div class="wrapper">
    <!-- Sidebar -->
    <div th:replace="~{include/sidebar :: sidebar}"></div>

    <div class="main-content">
        <!-- Contenu d'erreur -->
        <div class="error-content">
            <div class="error-container">
                <div class="error-icon">
                    <i class="bi bi-exclamation-triangle"></i>
                </div>

                <div class="error-code" th:text="${errorCode}">404</div>
                <h1 class="error-title" th:text="${errorTitle}">Page non trouvée</h1>
                <p class="error-message" th:text="${errorMessage}">
                    La page que vous recherchez n'existe pas ou a été déplacée.
                </p>

                <div class="error-actions">
                    <a href="/" class="btn btn-asecna">
                        <i class="bi bi-house me-2"></i>Retour à l'accueil
                    </a>
                    <a href="javascript:history.back()" class="btn btn-outline-asecna">
                        <i class="bi bi-arrow-left me-2"></i>Retour
                    </a>
                </div>

                <div class="error-details" th:if="${timestamp}">
                    <p>Erreur <span th:text="${errorCode}">404</span> |
                        <span th:text="${#temporals.format(timestamp, 'dd/MM/yyyy HH:mm')}">01/01/2023 12:00</span></p>
                    <p th:if="${path}">Chemin: <span th:text="${path}">/example</span></p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{include/footer :: footer}"></div>
</body>
</html>
