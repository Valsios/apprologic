<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASECNA - Approvisionnement et Achat</title>
    <link th:href="@{/assets/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/icon-font/bootstrap-icons.css}">

    <!-- CSS locaux -->
    <link rel="stylesheet" th:href="@{/assets/css/dataTables.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/includeCss.css}">
    <link rel="stylesheet" th:href="@{/assets/css/form.css}">

</head>
<body>
<div th:replace="~{include/navbar :: navbar}"></div>

<!-- Wrapper: sidebar + content -->
<div class="wrapper">

    <div th:replace="~{include/sidebar :: sidebar}"></div>
    <!-- Modal pour inventaire reel -->
    <div class="modal fade" id="inventaireModal" tabindex="-1" aria-labelledby="uploadModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="uploadModalLabel">Faire l'inventaire</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="inventaireForm">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <div class="mb-3">
                            <label for="fileInput" class="form-label">Quantité physique</label>
                            <input class="form-control" type="number" id="fileInput" name="quantite" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn btn-primary" id="submitInventaire">Envoyer</button>
                </div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="table-responsive shadow rounded bg-light p-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="text-black-50 m-0">Stock Articles</h3>
                <a href="/documents/download-stock-excel" class="btn btn-success">
                    <i class="fas fa-file-excel"></i> Exporter CSV
                </a>
            </div>

            <!-- Formulaire de recherche avec date -->
            <div class="search-container mb-3">
                <form id="searchForm" class="row g-3">
                    <div class="col-md-4">
                        <label for="searchDate" class="form-label">Date</label>
                        <input type="datetime-local" id="searchDate" class="form-control" th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd''T''HH:mm')}">
                    </div>
                    <div class="col-md-6">
                        <label for="searchInput" class="form-label">Recherche</label>
                        <div class="input-group">
                            <input type="text" id="searchInput" class="form-control" placeholder="Désignation ou code...">
                        </div>
                    </div>
                    <meta name="_csrf" th:content="${_csrf.token}"/>
                    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
                </form>

            </div>



            <!-- Tableau des résultats -->
            <table id="article-table" class="table table-striped table-hover table-bordered">
                <thead class="table-light">
                <tr>

                    <th>Désignation</th>
                    <th class="text-success fw-bold">Entrée(s)</th>
                    <th class="text-danger fw-bold">Sortie(s)</th>
                    <th class="text-center">En stock</th>
                    <th class="text-center">Dérnier mouvement</th>
                    <th class="text-center">Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="stock_fille : ${liste_article}">

                    <td>
                        <strong th:text="${stock_fille.article.codeArticle}"></strong>-
                        <span th:text="${stock_fille.article.designation}"></span>
                    </td>
                    <td class="text-success fw-bold text-end" th:text="${stock_fille.total_entree}">Entrée</td>
                    <td class="text-danger fw-bold text-end" th:text="${stock_fille.total_sortie}">Sortie</td>
                    <td th:text="${stock_fille.stock_date}" class="text-center">En stock</td>
                    <td th:text="${stock_fille.last_date}" class="text-center">Dernier Mouvement</td>
                    <td class="text-center">
                        <button class="btn btn-action" title="Inventaire"
                                data-action="inventaire"
                                th:attr="data-article-id=${stock_fille.article.getIdArticle()}"
                        >
                            <i class="bi bi-list-check"></i>
                        </button>
                    </td>
                </tr>
                <tr th:if="${liste_article.isEmpty()}">
                    <td colspan="3" class="text-center text-muted">Aucun article trouvé</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{include/footer :: footer}"></div>

<script src="/assets/js/myScript/scriptInventaire.js"></script>
<script src="/assets/js/myScript/scriptStock.js"></script>

</body>
</html>
