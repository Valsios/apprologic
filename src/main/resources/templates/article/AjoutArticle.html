<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASECNA - Approvisionnement et Achat</title>
    <link th:href="@{/assets/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/icon-font/bootstrap-icons.css}">

    <!-- CSS locaux -->
    <link rel="stylesheet" th:href="@{/assets/css/dataTables.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/includeCss.css}">
    <link rel="stylesheet" th:href="@{/assets/css/form.css}">

</head>
<body>
<div th:replace="~{include/navbar :: navbar}"></div>

<!-- Wrapper: sidebar + content -->
<div class="wrapper">

    <div th:replace="~{include/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="tab-content" id="formTabsContent">
            <!-- Formulaire Simple -->
            <div class="tab-pane fade show active" id="simpleFormTab" role="tabpanel">
                <div class="form-section">
                    <h2 class="form-title">
                        <i class="bi bi-box-seam me-2"></i>Nouvel Article
                    </h2>

                    <form th:action="@{/article/updateOrSave}"
                          th:object="${article}"
                          method="post">
                        <div class="mb-3">
                            <label for="codePgi" class="form-label">Code Article<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="codePgi"
                                   placeholder="Code PGI (3301, ...)"
                                   th:field="*{codeArticle}" required>
                        </div>

                        <div class="mb-3">
                            <label for="designation" class="form-label">Désignation<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="designation"
                                   placeholder="Nom d'article"
                                   th:field="*{designation}" required>
                        </div>

                        <div class="mb-3">
                            <label for="seuil" class="form-label">Seuil minimum<span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="seuil"
                                   th:field="*{seuilMin}"
                                   placeholder="1"
                                   required>
                        </div>

                        <label for="udm" class="form-label">Unité de Mesure<span class="text-danger">*</span></label>
                        <div class="mb-3">
                            <select class="form-select" id="udm" th:field="*{udm.idUdm}" required>
                                <option value="">Sélectionner une UDM</option>
                                <option th:each="udm : ${udmList}"
                                        th:value="${udm.idUdm}"
                                        th:text="${udm.acronyme + ' - ' + udm.description}"
                                        ></option>
                            </select>
                        </div>

                        <label for="famille" class="form-label">Famille<span class="text-danger">*</span></label>
                        <div class="mb-3">
                            <select class="form-select" id="famille" th:field="*{famille.idFamille}" required>
                                <option value="">Sélectionner une famille</option>
                                <option th:each="famille : ${familleList}"
                                        th:value="${famille.idFamille}"
                                        th:text="${famille.description}"
                                ></option>
                            </select>
                        </div>

                        <label for="centre" class="form-label">Centre budgetaire<span class="text-danger">*</span></label>
                        <div class="mb-3">
                            <select class="form-select" id="centre" th:field="*{centreBudgetaire.idCentre}" required>
                                <option value="">Sélectionner un centre budgetaire</option>
                                <option th:each="centre : ${centreList}"
                                        th:value="${centre.idCentre}"
                                        th:text="${centre.codeCentre}"
                                ></option>
                            </select>
                        </div>
                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/article/liste}" class="btn btn-outline-secondary">
                                <i class="bi bi-list me-1"></i> Liste
                            </a>
                            <button type="submit" class="btn btn-primary">Soumettre</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{include/footer :: footer}"></div>

</body>
</html>
