<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casier - Gestion Visuelle</title>
    <link th:href="@{/assets/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/icon-font/bootstrap-icons.css}">

    <!-- CSS locaux -->
    <link rel="stylesheet" th:href="@{/assets/css/dataTables.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/includeCss.css}">

    <style>
        /* Styles spécifiques à la page de notifications */
        .notification-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }

        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--asecna-accent);
            padding-bottom: 10px;
        }

        .notification-category {
            margin-bottom: 30px;
        }

        .notification-card {
            background: white;
            border-left: 4px solid #e74c3c;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 15px;
            margin-bottom: 15px;
            transition: transform 0.2s;
        }

        .notification-card.stock {
            border-left-color: #e74c3c; /* Rouge pour les alertes stock */
        }

        .notification-card.seuil {
            border-left-color: #f39c12; /* Orange pour les seuils */
        }

        .notification-card.system {
            border-left-color: #3498db; /* Bleu pour les systèmes */
        }

        .notification-title {
            font-weight: 600;
            color: var(--asecna-primary);
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        .notification-date {
            color: #7f8c8d;
            font-size: 0.85rem;
        }

        .notification-content {
            color: #34495e;
            margin-top: 8px;
            font-size: 0.95rem;
        }

        .notification-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 10px;
        }

        .badge-stock {
            background-color: #e74c3c;
            color: white;
        }

        .badge-seuil {
            background-color: #f39c12;
            color: white;
        }

        .empty-notifications {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
<!-- Remplacement du include navbar -->
<div th:replace="~{include/navbar :: navbar}"></div>

<div class="wrapper">
    <!-- Remplacement du include sidebar -->
    <div th:replace="~{include/sidebar :: sidebar}"></div>


    <div class="main-content">
        <div class="notification-container">
            <div class="notification-header">
                <h2><i class="bi bi-bell-fill me-2"></i>Notifications</h2>
                <span class="text-muted">Lecture seule</span>
            </div>

            <!-- Alertes Stock -->
            <div class="notification-category">
                <h4 class="mb-3"><i class="bi bi-box-seam me-2"></i>Alertes Stock</h4>

                <!-- Boucle sur les MessageBox -->
                <div th:each="message : ${messageBoxList}"
                     th:classappend="${message.type_message == 'epuisement'} ? 'stock' : 'seuil'"
                     class="notification-card">
                    <div class="notification-title">
                    <span th:text="${message.type_message == 'epuisement'} ?
                          'Stock épuisé - ' + ${message.article.nom} :
                          'Stock critique - ' + ${message.article.nom}"></span>
                        <span th:classappend="${message.type_message == 'epuisement'} ?
                          'badge-stock' : 'badge-seuil'"
                              class="notification-badge">
                        <span th:text="${message.type_message == 'epuisement'} ? 'STOCK' : 'SEUIL'"></span>
                    </span>
                    </div>
                    <div class="notification-date" th:text="${#temporals.format(message.dernierMouvement, 'dd/MM/yyyy HH:mm')}">
                        Date
                    </div>
                    <div class="notification-content">
                    <span th:if="${message.type_message == 'epuisement'}">
                        L'article <span th:text="${message.article.nom}"></span> est épuisé.
                        Dernière livraison: <span th:text="${#temporals.format(message.dernierMouvement, 'dd/MM/yyyy')}"></span>.
                    </span>
                        <span th:if="${message.type_message == 'seuil'}">
                        Le stock de <span th:text="${message.article.nom}"></span> est tombé à
                        <span th:text="${message.enStock}"></span> unités. Seuil minimum:
                        <span th:text="${message.article.seuilMin}"></span> unités.
                    </span>
                    </div>
                </div>

                <!-- Message si aucune alerte -->
                <div th:if="${#lists.isEmpty(messageBoxList)}" class="empty-notifications">
                    <i class="bi bi-check-circle" style="font-size: 2rem;"></i>
                    <p class="mt-3">Aucune alerte stock récente</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Remplacement du include footer -->
<div th:replace="~{include/footer :: footer}"></div>
</body>
</html>
