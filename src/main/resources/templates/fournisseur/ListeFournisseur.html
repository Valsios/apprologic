<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASECNA - Approvisionnement et Achat</title>
    <link th:href="@{/assets/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/icon-font/bootstrap-icons.css}">

    <!-- CSS locaux -->
    <link rel="stylesheet" th:href="@{/assets/css/dataTables.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/includeCss.css}">
    <link rel="stylesheet" th:href="@{/assets/css/form.css}">

    <style>
        .contact-info {
            font-size: 0.9rem;
            color: #6c757d;
        }
        .contact-info i {
            width: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
<div th:replace="~{include/navbar :: navbar}"></div>

<!-- Wrapper: sidebar + content -->
<div class="wrapper">
    <div th:replace="~{include/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="table-responsive shadow rounded bg-light p-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="text-black-50 mb-0">Liste des Fournisseurs</h3>
                <a th:href="@{/fournisseur/ajout}" class="btn btn-primary">
                    <i class="bi bi-plus-circle me-1"></i> Nouveau fournisseur
                </a>
            </div>
            <table id="fournisseur-table" class="table table-striped table-hover table-bordered">
                <thead class="table-light">
                <tr>
                    <th>Nom</th>
                    <th>Coordonnées</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="fournisseur : ${fournisseurListe}">
                    <td>
                        <strong th:text="${fournisseur.nom}">Nom du fournisseur</strong>
                    </td>
                    <td>
                        <div class="contact-info">
                            <div><i class="bi bi-telephone"></i> <span th:text="${fournisseur.contact}">Contact</span></div>
                            <div><i class="bi bi-envelope"></i> <span th:text="${fournisseur.mail}">Email</span></div>
                        </div>
                    </td>
                    <td>
                        <div class="btn-group" role="group">
                            <a class="btn btn-action edit" title="Modifier"
                               th:href="@{'/fournisseur/edit/' + ${fournisseur.idFournisseur}}">
                                <i class="bi bi-pencil"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                <tr th:if="${fournisseurListe.isEmpty()}">
                    <td colspan="3" class="text-center text-muted">Aucun fournisseur enregistré</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{include/footer :: footer}"></div>

</body>
</html>
