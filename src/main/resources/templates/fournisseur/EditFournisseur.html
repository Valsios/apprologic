<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASECNA - Approvisionnement et Achat</title>
    <link th:href="@{/assets/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/icon-font/bootstrap-icons.css}">

    <!-- CSS locaux -->
    <link rel="stylesheet" th:href="@{/assets/css/includeCss.css}">
    <link rel="stylesheet" th:href="@{/assets/css/form.css}">

</head>
<body>
<div th:replace="~{include/navbar :: navbar}"></div>

<!-- Wrapper: sidebar + content -->
<div class="wrapper">
    <div th:replace="~{include/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="tab-content" id="formTabsContent">
            <!-- Formulaire Fournisseur -->
            <div class="tab-pane fade show active" id="simpleFormTab" role="tabpanel">
                <div class="form-section">
                    <h2 class="form-title">
                        <i class="bi bi-building me-2"></i>Nouveau Fournisseur
                    </h2>

                    <form th:action="@{/fournisseur/save}"
                          th:object="${fournisseur}"
                          method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" th:field="*{idFournisseur}">
                        <div class="mb-3">
                            <label for="nom" class="form-label">Nom du fournisseur <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="nom"
                                   th:field="*{nom}"
                                   placeholder="Entrez le nom complet"
                                   required>
                            <div class="invalid-feedback">
                                Veuillez saisir le nom du fournisseur
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="contact" class="form-label">Contact <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="contact"
                                   th:field="*{contact}"
                                   placeholder="Numéro de téléphone"
                                   required>
                            <div class="invalid-feedback">
                                Veuillez saisir un contact valide
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email"
                                   th:field="*{mail}"
                                   placeholder="email@domaine.com"
                                   required>
                            <div class="invalid-feedback">
                                Veuillez saisir un email valide
                            </div>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/fournisseur/liste}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i> Retour
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-1"></i> Enregistrer
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{include/footer :: footer}"></div>

</body>
</html>
